<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="../assets/images/logo.svg" type="image/svg+xml">
  <title>Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="../css/pages/dashboard.css" />
  <link rel="stylesheet" href="../css/components/header.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="../js/main.js"></script>

  <script type="module">
    import { redirectIfNotLoggedIn } from "../js/auth-check.js";
    redirectIfNotLoggedIn();
  </script>

  <style>
    body {
      display: none;
    }
  </style>
</head>

<body>
  <div id="header-placeholder"></div>
  <!-- Main content -->
  <div class="main">
    <h2></br></h2>
    <div class="cards">
      <div class="card">
        <i class="fa-solid fa-smog"></i>
        <div class="value" id="value-mq2">--</div>
        <div class="label">Khí Gas</div>
      </div>
      <div class="card">
        <i class="fa-solid fa-temperature-half"></i>
        <div class="value" id="value-mq7">--</div>
        <div class="label">Khí CO</div>
      </div>
      <div class="card">
        <i class="fa-solid fa-lightbulb"></i>
        <div class="value" id="value-mq135">--</div>
        <div class="label">Khí dễ cháy</div>
      </div>
      <div class="card">
        <i class="fa-solid fa-bell-slash"></i>
        <div class="value" id="value-temp">--</div>
        <div class="label">Nhiệt độ</div>
      </div>
      <div class="card">
        <i class="fa-solid fa-water"></i>
        <div class="value" id="value-status">--</div>
        <div class="label">Thiết bị</div>
      </div>
    </div>

    <div class="stats">
      <div class="chart-container">
        <h3>Thống kê</h3>
        <canvas id="myChart" height="100"></canvas>
      </div>
      <div>
        <div class="water-container">
          <h3>Bình nước</h3>
          <div class="gauge-container">
            <div class="water" id="water" style="height: 60%;"></div>
            <div class="gauge-text" id="gauge-text">60%</div>
          </div>
        </div>
        <div><p></br></p></div>
        <div class="alarm-container">
          <h3>Còi báo động</h3>
          <h3></br></h3>
          <button id="alarm-button"><img src="../assets/images/alarm-01.png" style="max-height: 60px;"></button>
        </div>
      </div>
    </div>

    <h3></br>Thông báo hệ thống</h3>
    <table>
      <tr>
        <th>No</th>
        <th>ID</th>
        <th>Date</th>
        <th>Notification</th>
      </tr>
    </table>
  </div>

  <script src="../js/pages/dashboard.js"></script>
</body>

</html>
