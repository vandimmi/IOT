<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" href="../assets/images/logo.svg" type="image/svg+xml">
  <title>Sign Up</title>
  <link rel="stylesheet" href="../css/common.css"/>
  <link rel="stylesheet" href="../css/pages/signup.css"/>
</head>
<body>

  <div class="back-button">
    <a href="../pages/index.html">
      Back
    </a>
  </div>

  <div class="form-container">
    <div class="logo">
      <img src="../assets/images/logo.svg" alt="Logo"/>
    </div>
    <h2>Sign up</h2>
    <p class="subtext">Already have an account? <a href="../pages/login.html">Log in</a></p>

    <form id="signupForm">
      <div class="form-group">
        <label for="name">What should we call you?</label>
        <input type="text" id="name" placeholder="Enter your profile name" />
      </div>

      <div class="form-group">
        <label for="email">What’s your email?</label>
        <input type="email" id="email" placeholder="Enter your email address" />
      </div>

      <div class="form-group">
        <label for="password">Create a password</label>
        <input type="password" id="password" placeholder="Enter your password" />
        <p class="password-note">Use 8 or more characters with a mix of letters, numbers & symbols</p>
      </div>

      <button class="submit-btn">Sign up</button>
    </form>
  </div>
  <script>
    const form = document.getElementById('signupForm');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('https://iot-be-5421.onrender.com/api/auth/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            name: name,
            email: email,
            password
          })
        });

        const data = await res.json();

        if (res.ok) {
          // ✅ Lưu email tạm thời để sử dụng ở trang xác minh
          localStorage.setItem("verifyEmail", email);
          alert("Check your email for the verification code.");
          localStorage.setItem('pendingVerification', 'true');
          // ✅ Điều hướng sang trang xác thực
          window.location.href = "verify.html";
        } else {
          alert(data.message || "Sign up failed!");
        }
      } catch (err) {
        alert("Error connecting to server.");
        console.error(err);
      }
    });
  </script>
</body>
</html>
