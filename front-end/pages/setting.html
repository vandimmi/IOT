<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="../assets/images/logo.svg" type="image/svg+xml">
  <title>Setting</title>
  <link rel="stylesheet" href="../css/common.css" />
  <link rel="stylesheet" href="../css/components/header.css">
  <link rel="stylesheet" href="../css/pages/setting.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src = "../js/main.js"></script>

  <script type="module">
    import { redirectIfNotLoggedIn } from "../js/auth-check.js";
    redirectIfNotLoggedIn();
  </script>
</head>

<body>
  <div id="header-placeholder"></div>
  <div class="content">
    <h2>Setting</h2>

    <div class="setting-group">
      <div class="setting-row">
        <label for="smoke">Khói (ppm)</label>
        <input type="number" id="smoke" value="500">
      </div>
      <div class="setting-row">
        <label for="temp">Nhiệt độ (°C)</label>
        <input type="number" id="temp" value="50">
      </div>

      <div class="setting-row">
        <label>Báo động</label>
        <div class="toggle-switch">
          <label>
            <input type="checkbox" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="setting-row">
        <label>LED</label>
        <div class="toggle-switch">
          <label>
            <input type="checkbox" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="setting-row">
        <label>Vòi nước</label>
        <div class="toggle-switch">
          <label>
            <input type="checkbox" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <button class="save-btn">Save</button>
    </div>

  </div>

</body>
</html>
