<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="../assets/images/logo.svg" type="image/svg+xml">
  <title>Setting</title>
  <link rel="stylesheet" href="../css/common.css" />
  <link rel="stylesheet" href="../css/components/header.css">
  <link rel="stylesheet" href="../css/pages/setting.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src = "../js/main.js"></script>

  <script type="module">
    import { redirectIfNotLoggedIn } from "../js/auth-check.js";
    redirectIfNotLoggedIn();
  </script>
</head>

<body>
  <div id="header-placeholder"></div>
  <div class="content">
    <h2>Setting</h2>

    <div class="setting-group">
      <div class="setting-row">
        <label for="MQ2">Khí Gas</label>
        <input type="number" id="MQ2" value="500">
      </div>
      <div class="setting-row">
        <label for="MQ7">Khí CO</label>
        <input type="number" id="MQ7" value="1000">
      </div>
      <div class="setting-row">
        <label for="MQ135">Khí dễ cháy</label>
        <input type="number" id="MQ135" value="300">
      </div>
      <div class="setting-row">
        <label for="temp">Nhiệt độ (°C)</label>
        <input type="number" id="temp" value="50">
      </div>
      

      <button class="save-btn">Save</button>
    </div>

  </div>
  <script src ="../js/pages/setting.js"></script>
</body>
</html>
